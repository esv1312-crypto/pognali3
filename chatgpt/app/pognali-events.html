<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Погнали</title>
<style>
:root{color-scheme:light dark;font-family:system-ui,-apple-system,sans-serif}body{margin:0;padding:16px;background:transparent;color:CanvasText}
.wrap{display:grid;gap:12px}.head{display:flex;justify-content:space-between;align-items:center;gap:8px}h2{margin:0;font-size:22px}.sub,.status{opacity:.7;font-size:13px}
.nav,.filters,.actions{display:flex;gap:7px;flex-wrap:wrap}.card,.panel{border:1px solid color-mix(in srgb,CanvasText 14%,transparent);border-radius:18px;padding:14px;display:grid;gap:8px}
.card{background:color-mix(in srgb,CanvasText 3%,transparent)}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.title{font-weight:800;font-size:18px}.meta{font-size:14px;opacity:.82}.desc{font-size:14px;line-height:1.35}
button{border:0;border-radius:12px;padding:10px 13px;font:inherit;font-weight:750;cursor:pointer;background:#111;color:#fff}button.secondary{background:transparent;color:inherit;border:1px solid color-mix(in srgb,CanvasText 18%,transparent)}button[disabled]{opacity:.5}
input{border:1px solid color-mix(in srgb,CanvasText 18%,transparent);border-radius:10px;padding:10px;font:inherit;background:transparent;color:inherit;min-width:0}.age{width:70px}
.badge{font-size:12px;font-weight:750;padding:5px 8px;border-radius:999px;background:color-mix(in srgb,CanvasText 9%,transparent)}
.messages{display:grid;gap:5px;max-height:170px;overflow:auto}.message{padding:7px 9px;border-radius:10px;background:color-mix(in srgb,CanvasText 7%,transparent);font-size:13px}
.empty{text-align:center;padding:22px;opacity:.7}.create{border:1px dashed color-mix(in srgb,CanvasText 25%,transparent)}
</style></head>
<body><main class="wrap">
<div class="head"><div><h2 id="brand">Ну что, погнали?</h2><div class="sub" id="subtitle"></div></div><select id="language" aria-label="Language"></select></div>
<div class="nav">
<button class="secondary" data-tab="discover" id="tab-events"></button><button class="secondary" data-tab="mine" id="tab-mine"></button>
<button class="secondary" id="invites-tab"></button><button id="create"></button>
</div>
<section class="filters" id="filters">
<button class="secondary" data-date="today" id="date-today"></button><button class="secondary" data-date="tomorrow" id="date-tomorrow"></button>
<button class="secondary" data-date="weekend" id="date-weekend"></button><button class="secondary" data-date="all" id="date-all"></button>
</section>
<section id="invites" class="wrap"></section><section id="events" class="wrap"><div class="empty">`+T().load+`</div></section>
</main>
<script>
(()=>{const I18N={"ru":{"n":"Русский","s":"Не смотрим чужую жизнь — идём в свою.","events":"События","mine":"Мои","inv":"Приглашения","create":"Создать","today":"Сегодня","tom":"Завтра","week":"Выходные","all":"Все даты","load":"`+T().load+`","empty":"`+T().empty+`","err":"`+T().err+`","go":"ПОЙТИ","invite":"ПРИГЛАСИТЬ","write":"НАПИСАТЬ","leave":"НЕ ИДУ","age":"Возраст","chat":"`+T().chat+`","ph":"Напиши в чат…","send":"ОТПРАВИТЬ","no":"Пока сообщений нет.","first":"Можно быть первым","gather":"Люди уже собираются","one":"Осталось 1 место","full":"Мест нет","live":"🟢 Идёт сейчас","done":"Завершено","years":"лет","joined":"Ты присоединился. Погнали!","left":"Ты вышел из события."},"en":{"n":"English","s":"Don’t watch other people’s lives — go live yours.","events":"Events","mine":"My","inv":"Invitations","create":"Create","today":"Today","tom":"Tomorrow","week":"Weekend","all":"All dates","load":"Loading events…","empty":"Nothing here for this date yet.","err":"Could not load events.","go":"JOIN","invite":"INVITE","write":"CHAT","leave":"LEAVE","age":"Age","chat":"💬 Event chat","ph":"Write in the chat…","send":"SEND","no":"No messages yet.","first":"Be the first","gather":"People are joining","one":"1 spot left","full":"No spots left","live":"🟢 Live now","done":"Completed","years":"years","joined":"You joined. Let’s go!","left":"You left the event."},"de":{"n":"Deutsch","s":"Nicht das Leben anderer anschauen — dein eigenes leben.","events":"Events","mine":"Meine","inv":"Einladungen","create":"Erstellen","today":"Heute","tom":"Morgen","week":"Wochenende","all":"Alle Termine","load":"Events werden geladen…","empty":"Für dieses Datum gibt es noch nichts.","err":"Events konnten nicht geladen werden.","go":"TEILNEHMEN","invite":"EINLADEN","write":"CHAT","leave":"GEHE NICHT","age":"Alter","chat":"💬 Event-Chat","ph":"In den Chat schreiben…","send":"SENDEN","no":"Noch keine Nachrichten.","first":"Sei der Erste","gather":"Leute kommen zusammen","one":"Noch 1 Platz","full":"Keine Plätze frei","live":"🟢 Läuft jetzt","done":"Beendet","years":"Jahre","joined":"Du bist dabei. Los geht’s!","left":"Du hast das Event verlassen."},"es":{"n":"Español","s":"No mires la vida de otros — vive la tuya.","events":"Eventos","mine":"Míos","inv":"Invitaciones","create":"Crear","today":"Hoy","tom":"Mañana","week":"Fin de semana","all":"Todas las fechas","load":"Cargando eventos…","empty":"Todavía no hay nada para esta fecha.","err":"No se pudieron cargar los eventos.","go":"UNIRME","invite":"INVITAR","write":"CHAT","leave":"NO VOY","age":"Edad","chat":"💬 Chat del evento","ph":"Escribe en el chat…","send":"ENVIAR","no":"Todavía no hay mensajes.","first":"Sé el primero","gather":"La gente se está reuniendo","one":"Queda 1 plaza","full":"No quedan plazas","live":"🟢 Ahora mismo","done":"Finalizado","years":"años","joined":"Te has unido. ¡Vamos!","left":"Has salido del evento."},"it":{"n":"Italiano","s":"Non guardare la vita degli altri — vivi la tua.","events":"Eventi","mine":"I miei","inv":"Inviti","create":"Crea","today":"Oggi","tom":"Domani","week":"Weekend","all":"Tutte le date","load":"Caricamento eventi…","empty":"Niente per questa data, per ora.","err":"Impossibile caricare gli eventi.","go":"PARTECIPA","invite":"INVITA","write":"CHAT","leave":"NON VADO","age":"Età","chat":"💬 Chat dell’evento","ph":"Scrivi nella chat…","send":"INVIA","no":"Ancora nessun messaggio.","first":"Sii il primo","gather":"Le persone si stanno unendo","one":"Resta 1 posto","full":"Nessun posto disponibile","live":"🟢 In corso","done":"Completato","years":"anni","joined":"Ti sei unito. Andiamo!","left":"Hai lasciato l’evento."},"fr":{"n":"Français","s":"Ne regarde pas la vie des autres — vis la tienne.","events":"Événements","mine":"Mes événements","inv":"Invitations","create":"Créer","today":"Aujourd’hui","tom":"Demain","week":"Week-end","all":"Toutes les dates","load":"Chargement des événements…","empty":"Rien pour cette date pour le moment.","err":"Impossible de charger les événements.","go":"PARTICIPER","invite":"INVITER","write":"CHAT","leave":"JE NE VIENS PAS","age":"Âge","chat":"💬 Chat de l’événement","ph":"Écris dans le chat…","send":"ENVOYER","no":"Aucun message pour le moment.","first":"Sois le premier","gather":"Les participants arrivent","one":"1 place restante","full":"Complet","live":"🟢 En cours","done":"Terminé","years":"ans","joined":"Tu as rejoint l’événement. C’est parti !","left":"Tu as quitté l’événement."}};const langMap={ru:"ru",en:"en",de:"de",es:"es",it:"it",fr:"fr"};let lang=localStorage.getItem("pognali-lang")||langMap[(navigator.language||"ru").slice(0,2)]||"ru";const T=()=>I18N[lang]||I18N.ru;function applyLang(){document.documentElement.lang=lang;document.getElementById("subtitle").textContent=T().s;document.getElementById("tab-events").textContent=T().events;document.getElementById("tab-mine").textContent=T().mine;document.getElementById("invites-tab").textContent=T().inv;document.getElementById("create").textContent=T().create;document.getElementById("date-today").textContent=T().today;document.getElementById("date-tomorrow").textContent=T().tom;document.getElementById("date-weekend").textContent=T().week;document.getElementById("date-all").textContent=T().all;const s=document.getElementById("language");s.innerHTML=Object.entries(I18N).map(([k,v])=>'<option value="'+k+'">'+v.n+"</option>").join("");s.value=lang}
const A=window.openai||{}, root=document.getElementById("events"),inv=document.getElementById("invites");let selectedDate="today";
const uid="chatgpt-user", inputAge=Number(A?.toolInput?.user_age), profileAge=Number.isInteger(inputAge)&&inputAge>0?inputAge:null;
const esc=x=>String(x??"").replace(/[&<>"]/g,s=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[s]));
const payload=r=>r?.structuredContent||r?.structured_content||r;
const iso=d=>d.toISOString().slice(0,10);
function targetDate(){
const d=new Date();
if(selectedDate==="tomorrow")d.setDate(d.getDate()+1);
if(selectedDate==="weekend")return "weekend";
if(selectedDate==="all")return null;
return iso(d)
}
function statusText(e){if(e.status==="live")return T().live;if(e.status==="completed")return T().done;if(e.status==="full")return T().full;if(e.participant_count===0)return T().first;if(e.remaining_slots===1)return T().one;return T().gather}
async function tool(name,args){if(typeof A.callTool!=="function")throw Error("TOOL_UNAVAILABLE");return payload(await A.callTool(name,args))}
async function loadEvents(){let args={};const td=targetDate();if(td)args.event_date=td;try{const p=await tool("search_events",args);renderEvents(p?.events||[])}catch(e){root.innerHTML='<div class="empty">`+T().err+`</div>'}}
function renderEvents(items){if(!items.length){root.innerHTML='<div class="empty">`+T().empty+`</div>';return}
root.innerHTML=items.map(e=>{const age=e.age_range||{min:e.min_age,max:e.max_age};const ageCtl=profileAge?"":'<input class="age" type="number" min="0" max="120" placeholder="`+T().age+`" aria-label="`+T().age+`">';
return '<article class="card" data-event="'+esc(e.id)+'"><div class="row"><div class="title">'+esc(e.emoji||"📍")+' '+esc(e.title)+'</div><span class="badge" data-count>'+e.participant_count+' / '+e.max_participants+'</span></div>'+
'<div class="meta">📅 '+esc(e.date)+' · 🕐 '+esc(e.time)+' · 📍 '+esc(e.place?.name||e.place?.city||"Место уточняется")+'</div>'+
'<div class="meta">🎂 '+age.min+'–'+age.max+' `+T().years+` · '+esc(e.category||"other")+' · '+statusText(e)+'</div>'+
'<div class="desc">'+esc(e.description||"")+'</div><div class="actions">'+ageCtl+
'<button data-join>`+T().go+`</button><button class="secondary" data-invite>`+T().invite+`</button><button class="secondary" data-write>`+T().write+`</button>'+
'<button class="secondary" data-leave hidden>`+T().leave+`</button></div><div class="status"></div>'+
'<div data-chat hidden><div class="sub">`+T().chat+`</div><div class="messages"></div><div class="actions"><input data-msg placeholder="`+T().ph+`"><button data-send>`+T().send+`</button></div></div></article>'}).join("");
root.querySelectorAll(".card").forEach(card=>wire(card));}
function wire(card){const id=card.dataset.event,join=card.querySelector("[data-join]"),leave=card.querySelector("[data-leave]"),age=card.querySelector(".age"),status=card.querySelector(".status");
join.onclick=async()=>{const a=profileAge||Number(age?.value);if(!Number.isInteger(a)||a<0||a>120){age?.focus();return}join.disabled=true;join.textContent=T().go+"…";try{const p=await tool("join_event",{event_id:id,user_id:uid,user_age:a});if(p.error)throw Error(p.error);join.textContent=T().joined;leave.hidden=false;card.querySelector("[data-count]").textContent=p.participant_count+" / "+p.max_participants;status.textContent=T().joined;}catch(e){join.disabled=false;join.textContent="ПОЙТИ";status.textContent="Не удалось присоединиться: "+e.message}}
leave.onclick=async()=>{leave.disabled=true;try{const p=await tool("leave_event",{event_id:id,user_id:uid});if(p.error)throw Error(p.error);leave.hidden=true;join.disabled=false;join.textContent="ПОЙТИ";card.querySelector("[data-count]").textContent=p.participant_count+" / "+p.max_participants;status.textContent=T().left}catch(e){leave.disabled=false;status.textContent="Не удалось выйти: "+e.message}};
card.querySelector("[data-invite]").onclick=()=>{if(typeof A.sendFollowUpMessage==="function")A.sendFollowUpMessage({prompt:"Events "+id+". Help me invite someone separately, ask who to invite, then call create_invite. Do not create or change the event."})};
card.querySelector("[data-write]").onclick=async()=>{const chat=card.querySelector("[data-chat]");chat.hidden=!chat.hidden;if(!chat.hidden){try{const p=await tool("get_messages",{event_id:id,limit:50});chat.querySelector(".messages").innerHTML=(p.messages||[]).map(m=>'<div class="message"><b>'+esc(m.user_id)+'</b> '+esc(m.text)+'</div>').join("")||'<div class="sub">`+T().no+`</div>'}catch(e){}}};
card.querySelector("[data-send]").onclick=async()=>{const i=card.querySelector("[data-msg]"),t=i.value.trim();if(!t)return;try{const p=await tool("send_message",{event_id:id,user_id:uid,text:t});if(p.error)throw Error(p.error);i.value="";const chat=card.querySelector("[data-chat]");const msgs=chat.querySelector(".messages");const p2=await tool("get_messages",{event_id:id,limit:50});msgs.innerHTML=(p2.messages||[]).map(m=>'<div class="message"><b>'+esc(m.user_id)+'</b> '+esc(m.text)+'</div>').join("")||'<div class="sub">`+T().no+`</div>';chat.hidden=false;msgs.scrollTop=msgs.scrollHeight}catch(e){status.textContent="Не удалось отправить: "+e.message}}}
async function loadMine(){try{const p=await tool("my_events",{user_id:uid});renderEvents(p.events||[])}catch(e){root.innerHTML='<div class="empty">Не удалось загрузить «Мои».</div>'}}
async function loadInvites(){try{const p=await tool("get_user_invites",{user_id:uid}),items=(p.invites||[]).filter(x=>x.status==="pending");if(!items.length){inv.innerHTML="";return}
inv.innerHTML='<section class="panel"><b>💌 Тебя приглашают</b>'+items.map(i=>'<div class="card" data-invite-card="'+esc(i.id)+'"><div>'+esc(i.invite_text||("Событие "+i.event_id))+'</div><div class="actions"><button data-accept>ПОЙТИ</button><button class="secondary" data-decline>НЕ ИДУ</button></div><div class="status"></div></div>').join("")+'</section>';
inv.querySelectorAll("[data-invite-card]").forEach(c=>{c.querySelector("[data-accept]").onclick=async()=>{const a=profileAge;if(!Number.isInteger(a)){c.querySelector(".status").textContent="Нужно указать возраст.";return}try{const p=await tool("accept_invite",{invite_id:c.dataset.inviteCard,user_id:uid,user_age:a});if(p.error)throw Error(p.error);c.remove();loadEvents()}catch(e){c.querySelector(".status").textContent="Не удалось: "+e.message}};c.querySelector("[data-decline]").onclick=async()=>{try{await tool("decline_invite",{invite_id:c.dataset.inviteCard,user_id:uid});c.remove()}catch(e){}}})}catch(e){}}
document.getElementById("language").onchange=e=>{lang=e.target.value;localStorage.setItem("pognali-lang",lang);applyLang();loadEvents();loadInvites()};applyLang();document.querySelectorAll("[data-date]").forEach(b=>b.onclick=()=>{selectedDate=b.dataset.date;loadEvents()});
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{if(b.dataset.tab==="mine")loadMine();else loadEvents()});
document.getElementById("invites-tab").onclick=()=>{loadInvites();inv.scrollIntoView({behavior:"smooth"})};
document.getElementById("create").onclick=()=>{if(typeof A.sendFollowUpMessage==="function")A.sendFollowUpMessage({prompt:"Хочу создать событие в Погнали. Собери только недостающие обязательные данные: название, категория/emoji, дата, время, место, максимальное количество участников, минимальный и максимальный возраст, описание. Максимальную вместимость не задавай по умолчанию — её выбираю я. Затем вызови create_event. Создание и приглашение — разные действия."})};
loadEvents();loadInvites();
})();</script></body></html>
