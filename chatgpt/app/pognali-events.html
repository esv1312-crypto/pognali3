<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Погнали</title>
<style>
:root{color-scheme:light dark;font-family:system-ui,-apple-system,sans-serif}
body{margin:0;padding:16px;background:transparent;color:CanvasText}
.wrap{display:grid;gap:12px}
h2{margin:0;font-size:22px}
.sub{opacity:.7;font-size:14px}
.card{border:1px solid color-mix(in srgb,CanvasText 14%,transparent);border-radius:18px;padding:14px;display:grid;gap:8px}
.row{display:flex;justify-content:space-between;gap:12px;align-items:center}
.title{font-weight:750;font-size:18px}
.meta{font-size:14px;opacity:.8}
.desc{font-size:14px;line-height:1.35}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.message-box{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chat{border-top:1px solid color-mix(in srgb,CanvasText 10%,transparent);padding-top:10px;display:grid;gap:6px}
.chat-title{font-size:13px;font-weight:700;opacity:.75}
.messages{display:grid;gap:6px;max-height:180px;overflow:auto}
.message{font-size:13px;line-height:1.3;padding:7px 9px;border-radius:10px;background:color-mix(in srgb,CanvasText 7%,transparent)}
.message-user{font-weight:700;margin-right:5px}
.no-messages{font-size:13px;opacity:.55}
.message-input{flex:1;min-width:0;border:1px solid color-mix(in srgb,CanvasText 18%,transparent);border-radius:10px;padding:10px;font:inherit;background:transparent;color:inherit}
button{border:0;border-radius:12px;padding:11px 14px;font:inherit;font-weight:700;cursor:pointer;background:#111;color:#fff}
button[disabled]{opacity:.55;cursor:default}
.age{width:76px;border:1px solid color-mix(in srgb,CanvasText 18%,transparent);border-radius:10px;padding:10px;font:inherit;background:transparent;color:inherit}
@media(prefers-color-scheme:dark){button{background:#fff;color:#111}}
.empty{padding:20px 8px;text-align:center;opacity:.75}
.status{font-size:13px;opacity:.75}
.create-cta{border:1px dashed color-mix(in srgb,CanvasText 25%,transparent);border-radius:16px;padding:14px;display:grid;gap:8px}
.create-cta strong{font-size:16px}
.create-cta button{justify-self:start}
</style>
</head>
<body>
<main class="wrap">
  <div>
    <h2>Ну что, погнали?</h2>
    <div class="sub">Сегодня рядом с тобой</div>
  </div>
  <section class="create-cta">
    <strong>🔥 Не нашёл своё?</strong>
    <div class="sub">Создай свою движуху — соберём людей и пойдём.</div>
    <button type="button" id="create-event">СОЗДАТЬ СВОЙ МИР</button>
  </section>
  <section id="invites" class="wrap" aria-live="polite"></section>
  <section id="events" class="wrap" aria-live="polite">
    <div class="empty">Жду события от Погнали…</div>
  </section>
</main>
<script>
(function(){
  const root=document.getElementById("events");
  const invitesRoot=document.getElementById("invites");
  const openai=typeof window!=="undefined"?window.openai:undefined;
  const inputAge=Number(openai?.toolInput?.user_age);
  const userAge=Number.isInteger(inputAge)&&inputAge>0?inputAge:null;

  function esc(v){
    return String(v??"").replace(/[&<>"]/g,s=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[s]));
  }

  async function join(eventId, button, ageField){
    const age=userAge||Number(ageField?.value);
    if(!Number.isInteger(age)||age<0||age>120){
      if(ageField){ageField.focus();ageField.setCustomValidity("Укажи возраст");ageField.reportValidity();}
      return;
    }
    button.disabled=true;
    button.textContent="Входим…";
    try{
      if(typeof openai?.callTool!=="function"){
        if(typeof openai?.sendFollowUpMessage==="function"){
          await openai.sendFollowUpMessage({prompt:"Я хочу присоединиться к событию "+eventId+". Мой возраст: "+age});
        }else{
          throw new Error("Host tool bridge unavailable");
        }
        return;
      }
      const result=await openai.callTool("join_event",{
        event_id:eventId,
        user_id:"chatgpt-user",
        user_age:age
      });
      const payload=result?.structuredContent||result?.structured_content||result;
      if(payload?.joined){
        button.textContent="ТЫ ИДЁШЬ ✓";
        button.dataset.joined="true";
        const card=button.closest(".card");
        const count=card?.querySelector("[data-count]");
        if(count) count.textContent=payload.participant_count+" / "+payload.max_participants;
        const status=card?.querySelector(".status");
        if(status) status.textContent="Ты присоединился. Погнали!";
      }else{
        button.disabled=false;
        button.textContent="ПОЙТИ";
        const status=button.closest(".card")?.querySelector(".status");
        if(status) status.textContent="Не удалось присоединиться: "+(payload?.error||"неизвестная ошибка");
      }
    }catch(err){
      button.disabled=false;
      button.textContent="ПОЙТИ";
      const status=button.closest(".card")?.querySelector(".status");
      if(status) status.textContent="Не удалось выполнить действие. Попробуй ещё раз.";
    }
  }

  async function gather(eventId, button){
    try{
      if(typeof openai?.callTool==="function"){
        const result=await openai.callTool("prepare_invite",{
          event_id:eventId,
          user_id:"chatgpt-user"
        });
        const payload=payloadFrom(result);
        if(payload?.invite_text){
          const card=button.closest(".card");
          const status=card?.querySelector(".status");
          if(status) status.textContent="Приглашение готово — его можно отправить друзьям.";
          const box=card?.querySelector(".message-box");
          const input=card?.querySelector(".message-input");
          if(input) input.value=payload.invite_text;
          if(box) box.hidden=false;
          button.textContent="ПРИГЛАШЕНИЕ ГОТОВО ✓";
          return;
        }
      }
      if(typeof openai?.sendFollowUpMessage==="function"){
        await openai.sendFollowUpMessage({prompt:"Подготовь приглашение для события "+eventId+" по данным события, без выдумывания деталей."});
      }
    }catch(err){
      const status=button.closest(".card")?.querySelector(".status");
      if(status) status.textContent="Не удалось подготовить приглашение.";
      button.disabled=false;
      button.textContent="СОБРАТЬ КОМПАНИЮ";
    }
  }

  function payloadFrom(result){
    return result?.structuredContent||result?.structured_content||result;
  }

  function renderMessages(card, payload){
    const box=card?.querySelector(".messages");
    if(!box) return;
    const messages=Array.isArray(payload?.messages)?payload.messages:[];
    box.innerHTML=messages.length
      ? messages.map(m=>'<div class="message"><span class="message-user">'+esc(m.user_id||"Участник")+'</span>'+esc(m.text)+'</div>').join("")
      : '<div class="no-messages">Пока сообщений нет.</div>';
    box.scrollTop=box.scrollHeight;
  }

  async function loadMessages(eventId, card){
    try{
      if(typeof openai?.callTool!=="function") return;
      const result=await openai.callTool("get_messages",{event_id:eventId,limit:50});
      renderMessages(card,payloadFrom(result));
    }catch(err){}
  }

  async function writeMessage(eventId, button){
    const card=button.closest(".card");
    const input=card?.querySelector(".message-input");
    const text=input?.value?.trim();
    if(!text){
      if(input){input.focus();input.setCustomValidity("Напиши сообщение");input.reportValidity();}
      return;
    }
    button.disabled=true;
    button.textContent="ОТПРАВЛЯЕМ…";
    try{
      if(typeof openai?.callTool!=="function"){
        if(typeof openai?.sendFollowUpMessage==="function"){
          await openai.sendFollowUpMessage({prompt:"Напиши в чат события "+eventId+": "+text});
        }else{
          throw new Error("Host tool bridge unavailable");
        }
      }else{
        const result=await openai.callTool("send_message",{
          event_id:eventId,
          user_id:"chatgpt-user",
          text
        });
        const payload=result?.structuredContent||result?.structured_content||result;
        if(payload?.error) throw new Error(payload.error);
      }
      input.value="";
      await loadMessages(eventId,card);
      button.textContent="ОТПРАВЛЕНО ✓";
      const status=card?.querySelector(".status");
      if(status) status.textContent="Сообщение отправлено в чат события.";
      setTimeout(()=>{button.disabled=false;button.textContent="НАПИСАТЬ";},1200);
    }catch(err){
      button.disabled=false;
      button.textContent="НАПИСАТЬ";
      const status=card?.querySelector(".status");
      if(status) status.textContent="Не удалось отправить сообщение. Попробуй ещё раз.";
    }
  }

  async function loadInvites(){
    if(!invitesRoot||typeof openai?.callTool!=="function") return;
    try{
      const result=await openai.callTool("get_user_invites",{user_id:"chatgpt-user"});
      const payload=payloadFrom(result);
      const invites=Array.isArray(payload?.invites)?payload.invites.filter(i=>i.status==="pending"):[];
      if(!invites.length){invitesRoot.innerHTML="";return;}
      invitesRoot.innerHTML='<section class="create-cta"><strong>💌 Тебя зовут</strong>'+
        invites.map(i=>'<div class="card" data-invite-card="'+esc(i.id)+'">'+
          '<div class="title">'+esc(i.invite_text)+'</div>'+
          '<div class="actions">'+
          '<button type="button" class="accept-invite" data-invite="'+esc(i.id)+'">ПОЙТИ</button>'+
          '<button type="button" class="decline-invite" data-invite="'+esc(i.id)+'">НЕ ИДУ</button>'+
          '</div><div class="status" aria-live="polite"></div></div>').join("")+
        '</section>';
      invitesRoot.querySelectorAll(".accept-invite").forEach(button=>{
        button.addEventListener("click",()=>respondInvite(button,true));
      });
      invitesRoot.querySelectorAll(".decline-invite").forEach(button=>{
        button.addEventListener("click",()=>respondInvite(button,false));
      });
    }catch(err){}
  }

  async function respondInvite(button, accept){
    const card=button.closest("[data-invite-card]");
    button.disabled=true;
    const other=card?.querySelector(accept?".decline-invite":".accept-invite");
    if(other) other.disabled=true;
    button.textContent=accept?"ВХОЖУ…":"ОТКЛОНЯЕМ…";
    try{
      if(typeof openai?.callTool!=="function") throw new Error("Host tool bridge unavailable");
      if(accept){
        const age=userAge;
        if(!Number.isInteger(age)){
          throw new Error("AGE_REQUIRED");
        }
        const result=await openai.callTool("accept_invite",{
          invite_id:button.dataset.invite,
          user_id:"chatgpt-user",
          user_age:age
        });
        const payload=payloadFrom(result);
        if(payload?.error) throw new Error(payload.error);
        button.textContent="ТЫ ИДЁШЬ ✓";
        card?.querySelector(".status")?.replaceChildren(document.createTextNode("Ты присоединился. Погнали!"));
        // После принятия приглашения обновляем список событий, чтобы счётчик и статус были актуальными.
        try{
          if(typeof openai?.callTool==="function"){
            const eventsResult=await openai.callTool("search_events",{event_date:new Date().toISOString().slice(0,10)});
            render(payloadFrom(eventsResult));
          }
        }catch(err){}
      }else{
        const result=await openai.callTool("decline_invite",{
          invite_id:button.dataset.invite,
          user_id:"chatgpt-user"
        });
        const payload=payloadFrom(result);
        if(payload?.error) throw new Error(payload.error);
        card?.remove();
        if(!invitesRoot.querySelector("[data-invite-card]")) invitesRoot.innerHTML="";
        return;
      }
      setTimeout(()=>card?.remove(),900);
    }catch(err){
      button.disabled=false;
      if(other) other.disabled=false;
      button.textContent=accept?"ПОЙТИ":"НЕ ИДУ";
      const status=card?.querySelector(".status");
      if(status) status.textContent=err.message==="AGE_REQUIRED"?"Нужно указать возраст в профиле.":"Не удалось обработать приглашение. Попробуй ещё раз.";
    }
  }

  function render(data){
    const created=data?.id&&!Array.isArray(data?.events)?data:null;
    const items=Array.isArray(data?.events)?data.events:(created?[created]:[]);
    if(!items.length){root.innerHTML='<div class="empty">Сегодня рядом пока ничего нет.</div>';return;}
    root.innerHTML=items.map(e=>{
      const age=e.age_range||{min:e.min_age,max:e.max_age};
      const ageControl=userAge
        ? ""
        : '<input class="age" type="number" min="0" max="120" inputmode="numeric" placeholder="Возраст" aria-label="Возраст">';
      return '<article class="card">'+
        '<div class="row"><div class="title">'+esc(e.emoji||"📍")+' '+esc(e.title)+'</div><strong data-count>'+esc(e.participant_count)+' / '+esc(e.max_participants)+'</strong></div>'+
        '<div class="meta">'+esc(e.date||"Дата уточняется")+' · '+esc(e.time)+' · 📍 '+esc(e.place?.name||e.place?.city||"Место уточняется")+'</div>'+
        '<div class="meta">🎂 '+esc(age.min)+'–'+esc(age.max)+' лет</div>'+
        '<div class="desc">'+esc(e.description||"")+'</div>'+
        '<div class="actions">'+ageControl+'<button type="button" data-id="'+esc(e.id)+'">ПОЙТИ</button>'+
        '<button type="button" class="write" data-write="'+esc(e.id)+'">НАПИСАТЬ</button>'+
        (created?'<button type="button" class="gather" data-gather="'+esc(e.id)+'">СОБРАТЬ КОМПАНИЮ</button>':"")+
        '</div>'+
        '<div class="chat"><div class="chat-title">💬 Чат события</div><div class="messages"><div class="no-messages">Загрузка…</div></div></div>'+
        '<div class="message-box" hidden><input class="message-input" type="text" maxlength="500" placeholder="Напиши в чат…" aria-label="Сообщение"><button type="button" class="send" data-send="'+esc(e.id)+'">ОТПРАВИТЬ</button></div>'+
        '<div class="status" aria-live="polite"></div>'+
      '</article>';
    }).join("");

    root.querySelectorAll("button[data-id]").forEach(button=>{
      button.addEventListener("click",()=>{
        const card=button.closest(".card");
        join(button.dataset.id,button,card?.querySelector(".age"));
      });
    });
    root.querySelectorAll(".card").forEach(card=>loadMessages(card.querySelector("button[data-id]")?.dataset.id,card));
    root.querySelectorAll("button[data-write]").forEach(button=>{
      button.addEventListener("click",()=>{
        const box=button.closest(".card")?.querySelector(".message-box");
        if(box){
          box.hidden=!box.hidden;
          if(!box.hidden) box.querySelector(".message-input")?.focus();
        }
      });
    });
    root.querySelectorAll("button[data-send]").forEach(button=>{
      button.addEventListener("click",()=>writeMessage(button.dataset.send,button));
    });
    root.querySelectorAll(".message-input").forEach(input=>{
      input.addEventListener("keydown",event=>{
        if(event.key==="Enter"){
          event.preventDefault();
          input.closest(".message-box")?.querySelector("button[data-send]")?.click();
        }
      });
    });
    root.querySelectorAll("button[data-gather]").forEach(button=>{
      button.addEventListener("click",()=>{
        button.disabled=true;
        button.textContent="СОБИРАЕМ…";
        gather(button.dataset.gather,button);
      });
    });
  }

  document.getElementById("create-event")?.addEventListener("click",()=>{
    try{
      if(typeof openai?.sendFollowUpMessage==="function"){
        openai.sendFollowUpMessage({prompt:"Хочу создать своё событие в Погнали. Помоги создать его: спроси только недостающие обязательные данные (название, дата, время, место, максимальное количество участников, минимальный и максимальный возраст), затем вызови create_event."});
      }
    }catch(err){}
  });

  window.pognaliRender=render;
  loadInvites();
  window.addEventListener("message",function(event){
    const result=event.data?.result;
    if(result?.structuredContent) render(result.structuredContent);
    else if(result?.structured_content) render(result.structured_content);
    else if(result?.content?.[0]?.text){
      try{render(JSON.parse(result.content[0].text));}catch(e){}
    }
  });
})();
</script>
</body>
</html>
