vent(${e.id})`:`joinEvent(${e.id})`}">${joined?'ВЫЙТИ':(full?'МЕСТ НЕТ':'ПОЙДУ')}</button><button class="secondary" onclick="event.stopPropagation();openEvent(${e.id})">Подробнее</button></div></div>`}

function openEvent(id){let e=db.events.find(x=>x.id===id);if(!e)return;let joined=e.people.includes(2),member=isEventMember(e),full=e.people.length>=e.limit,started=eventState(e)==='STARTED';let liveNote=e.liveNote?`<div class="public-note"><b>📌 От организатора</b><div>${esc(e.liveNote)}</div></div>`:'';let q=(db.questions[id]||[]);let organizerQuestionInbox=e.owner===2&&q.length?`<div class="question-box"><b>💬 Вопросы от участников</b>${q.map((m,i)=>`<div class="question-item"><div class="question-meta">${esc(userDisplay(m.u))}</div><div>${esc(m.t)}</div>${m.a?`<div style="margin-top:5px;color:#555">↳ ${esc(m.a)}</div>`:`<button class="secondary" style="margin-top:7px" onclick="answerQuestion(${e.id},${i})">Ответить</button>`}</div>`).join('')}</div>`:'';let askButton=!joined&&e.owner!==2?`<button class="secondary" onclick="askOrganizer(${e.id})">💬 Задать вопрос</button>`:'';openModal(`<button class="close" onclick="closeModal()">✕</button><span class="tag">${esc(e.cat)}</span>${started?'<div class="live-status">🟢 Событие идёт</div>':''}<h2>${esc(e.title)}</h2><div class="meta"><b>${fmt(e)}</b><br>📍 ${esc(displayPlace(e))}<br>👥 ${e.people.length}/${e.limit} участников${e.ageRange&&e.ageRange!=='Любой возраст'?`<br>👤 ${esc(e.ageRange)}`:''}</div>${e.desc?`<p>${esc(e.desc)}</p>`:''}${liveNote}<div class="card"><b>Участники · ${e.people.length}</b><div class="participant-list">${e.people.map(participantRow).join('')||'<div class="meta">Пока никто не присоединился</div>'}</div></div>${organizerQuestionInbox}<div class="actions"><button class="${joined?'secondary':'primary'}" ${full&&!joined?'disabled':''} onclick="${joined?`leaveEvent(${e.id})`:full?'':`joinEvent(${e.id})`}">${joined?'ВЫЙТИ':(full?'МЕСТ НЕТ':'ПОЙДУ')}</button>${askButton}${member?`<button class="secondary" onclick="openChat(${e.id})">ЧАТ</button>`:''}${e.owner===2?`<button class="secondary" onclick="updateLiveNote(${e.id})">📌 Обновить сообщение</button><button class="secondary" onclick="editEvent(${e.i function askOrganizer(id){let e=db.events.find(x=>x.id===id);if(!e||e.owner===2)return;let q=(db.questions[id]||[]);openModal(`<button class="close" onclick="openEvent(${id})">✕</button><h2>Вопрос организатору</h2><div class="meta" style="margin-bottom:10px">${esc(e.title)} · ${esc(userDisplay(e.owner))}</div><form onsubmit="sendQuestion(event,${id})"><div class="field"><label>Что хочешь спросить?</label><textarea id="questionInput" required maxlength="500" placeholder="Например: можно немного опоздать? что взять с собой?"></textarea></div><button class="primary full">ОТПРАВИТЬ ВОПРОС</button></form>${q.length?`<div class="question-box"><b>Твои сообщения</b>${q.filter(m=>m.u===2).map(m=>`<div class="question-item"><div>${esc(m.t)}</div>${m.a?`<div style="margin-top:5px;color:#555">↳ ${esc(m.a)}</div>`:'<div class="question-meta" style="margin-top:4px">Ждём ответа организатора</div>'}</div>`).join('')}</div>`:''}`)}

function readEvent(existing=null){
  const title=document.getElementById('etitle').value.trim();
  const cat=document.getElementById('ecat').value;
  const date=document.getElementById('edate').value;
  if(!date) throw new Error('Укажи дату события.');
  if(date<localDateKey()) throw new Error('Нельзя создать событие в прошлом.');
  const emoji=(document.getElementById('eemoji').value.trim()||'').slice(0,8);
  const time=document.getElementById('etime').value.trim();
  if(!/^([01]?[0-9]|2[0-3]):[0-5][0-9]$/.test(time)) throw new Error('Введи время в формате 09:56.');
  const start=eventStart({date,time});
  const unchangedExistingStart=!!(existing&&existing.date===date&&existing.time===time);
  if(start<=new Date()&&!unchangedExistingStart) throw new Error('Дата и время события уже прошли.');
  const lat=parseFloat(document.getElementById('elat').value);
  const lng=parseFloat(document.getElementById('elng').value);
  if(!validCoordinates(lat,lng)) throw new Error('Укажи корректную точку на карте.');
  let ageRange=document.getElementById('eage').value;
  if(ageRange==='Свой диапазон'){const min=document.getElementById('ageMin')?.value,max=document.getElementById('ageMax')?.value;const parsed=parseCustomAge(`${min}–${max}`);if(!parsed)throw new Error('Укажи корректный возрастной диапазон. Например: 25–35.');ageRange=parsed;}
  return {title,cat,emoji,date,time,place:document.getElementById('eplace').value.trim(),lat,lng,limit:Math.max(1,Math.min(100,parseInt(document.getElementById('elimit').value,10)||1)),ageRange,desc:document.getElementById('edesc').value.trim(),liveNote:document.getElementById('eliveNote').value.trim(),country:document.getElementById('ecountry')?.value.trim()||'',city:document.getElementById('ecity')?.value.trim()||''};
}

const eventIconCache=new Map();
function eventIcon(cat,title='',custom=''){
  if(custom) return custom;

  const cached=eventIconCache.get(cacheKey);

  const t=String(title||'').toLowerCase();

  const specific=[

    [/забег|бег|бежим|пробежк|run/,'🏃'],
    [/баскетбол|баскет/,'🏀'],
    [/волейбол|волейб/,'🏐'],

    [/йог|растяжк/,'🧘'],

    [/кофе|кофейн|капучино|латте/,'☕'],
    [/бар|пив|паб|выпив/,'🍻'],
    [/ресторан|ужин|обед|еда|поесть/,'🍽️'],
    [/кино|фильм|cinema/,'🎬'],
    [/концерт|музык|музыка|джаз|рок/,'🎵'],
    [/танц|дискотек/,'💃'],
    [/вечерин|party/,'🥳'],
    [/поход|треккинг|горы|пеший маршрут/,'🥾'],
    [/путешеств|поездк|экскурс/,'🧳'],
    [/фото|фотосесс|съёмк/,'📸'],
    [/настолк|игр/,'🎲'],
    [/учёб|учеб|лекц|курс|английск|математ/,'📚'],
    [/прогул|парк|набережн|гулять/,'🚶'],
    [/знаком|общен|поболт|встрет/,'👋']
  ];
  for(const [re,icon] of specific) if(re.test(t)){eventIconCache.set(cacheKey,icon);return icon;}
  const icon=({'Спорт':'🏅','Прогулка':'🚶','Кино':'🎬','Кафе/бар':'🍻','Кафе/еда':'☕','Путешествие':'🧳','Вечеринка':'🥳','Учёба':'📚','Общение':'👋','Игры':'🎮','Настольные игры':'🎲','Мафия':'🕵️','Музыка/концерт':'🎵','Природа/поход':'🥾','Творчество':'🎨','Фото':'📸','Авто':'🚗','Шопинг':'🛍️','Знакомства':'💬','Другое':'✨'})[cat]||'📍';
  eventIconCache.set(cacheKey,icon);
  return icon;
}
function initPickerMap(lat,lng,hasPoint){
  destroyPickerMap();
  const centerLat=Number.isFinite(+lat)?+lat:(userGeo?.lat||MAP_CENTER.lat);
  const centerLng=Number.isFinite(+lng)?+lng:(userGeo?.lng||MAP_CENTER.lng);
  pickerMap=L.map('pickerMap').setView([centerLat,centerLng],14);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(pickerMap);
  if(userGeo)drawPickerUserLocation(userGeo.lat,userGeo.lng);
  if(hasPoint)setPickerPoint(centerLat,centerLng,false);
  pickerMap.on('click',ev=>setPickerPoint(ev.latlng.lat,ev.latlng.lng,true));
  setTimeout(()=>{if(pickerMap)pickerMap.invalidateSize()},100);
  if(userGeo){
    if(!hasPoint)pickerMap.setView([userGeo.lat,userGeo.lng],14,{animate:false});
  }else{
    requestUserLocation(false,geo=>{
      if(pickerMap){drawPickerUserLocation(geo.lat,geo.lng);if(!hasPoint && !pickerMarker)pickerMap.setView([geo.lat,geo.lng],14,{animate:false});}
    });
  }
}

async function reverseGeocode(lat,lng){
  const fallback={place:'Точка на карте '+lat.toFixed(5)+', '+lng.toFixed(5),country:'',city:''};
  const parse=(data)=>{const a=data?.address||data?.properties||{};const country=a.country||a.country_name||'';const city=a.city||a.town||a.village||a.municipality||a.city_district||'';const venue=a.name||a.amenity||a.leisure||a.tourism||'';const road=a.road||a.street||a.pedestrian||a.path||a.cycleway||a.footway||'';const house=a.house_number?(', '+a.house_number):'';let detail=venue&&road&&venue!==road?venue+' · '+road+house:(venue||road)+house;let place=[country,city,detail].filter(Boolean).join(', ');if(!place&&data?.display_name)place=data.display_name.split(',').slice(0,4).join(', ').trim();return {place:place||fallback.place,country,city};};
  try{const url='https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&addressdetails=1&accept-language=ru&lat='+encodeURIComponent(lat)+'&lon='+encodeURIComponent(lng);const r=await fetch(url,{headers:{'Accept':'application/json'}});if(!r.ok)throw new Error();const data=await r.json();const parsed=parse(data);if(parsed.place)return parsed;}catch(e){}
  try{const url='https://photon.komoot.io/reverse?lat='+encodeURIComponent(lat)+'&lon='+encodeURIComponent(lng);const r=await fetch(url,{headers:{'Accept':'application/json'}});if(!r.ok)throw new Error();const data=await r.json();const parsed=parse(data?.features?.[0]);if(parsed.place)return parsed;}catch(e){}
  return fallback;
}
function validCoordinates(lat,lng){return Number.isFinite(+lat)&&Number.isFinite(+lng)&&+lat>=-90&&+lat<=90&&+lng>=-180&&+lng<=180;}
async function setPickerPoint(lat,lng,lookupPlace=true){
  if(!validCoordinates(lat,lng))return showToast('Не удалось определить корректные координаты.','error');
  const lookupToken=++pickerLookupToken;
  const latEl=document.getElementById('elat'),lngEl=document.getElementById('elng'),placeEl=document.getElementById('eplace'),statusEl=document.getElementById('pickedCoords'),countryEl=document.getElementById('ecountry'),cityEl=document.getElementById('ecity');
  latEl.value=lat;lngEl.value=lng;
  if(lookupPlace){placeEl.value='Определяю место…';statusEl.textContent='Определяю страну, город и адрес…';}
  else if(!placeEl.value.trim()) statusEl.textContent='Точка выбрана';
  if(pickerMarker) pickerMarker.setLatLng([lat,lng]); else pickerMarker=L.marker([lat,lng],{draggable:true}).addTo(pickerMap);
  if(!pickerMarker._pognaliDragBound){pickerMarker.on('dragend',()=>{let p=pickerMarker.getLatLng();setPickerPoint(p.lat,p.lng,true)});pickerMarker._pognaliDragBound=true}
  pickerMap.panTo([lat,lng]);
  if(lookupPlace){const info=await reverseGeocode(lat,lng);if(lookupToken!==pickerLookupToken||!pickerMap||!pickerMarker)return;placeEl.value=info.place;if(countryEl)countryEl.value=info.country||'';if(cityEl)cityEl.value=info.city||'';statusEl.textContent=info.country&&info.city?'Место определено':'Адрес определён, но страна/город не найдены';pickerMarker.bindPopup('📍 '+info.place).openPopup();}
  else if(pickerMarker){pickerMarker.bindPopup('📍 '+(placeEl.value.trim()||'Точка выбрана'));}
}

let lastGeocodeAt=0;
async function findPlace(){
  let q=document.getElementById('eplace').value.trim();
  if(!q)return showToast('Сначала напиши название места или адрес.','error');
  const now=Date.now();if(now-lastGeocodeAt<1000)return showToast('Подожди секунду перед следующим поиском.','info');
  lastGeocodeAt=now;
  const lookupToken=++pickerLookupToken;
  let status=document.getElementById('pickedCoords');status.textContent='Ищу место…';
  try{
    let url='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&accept-language='+encodeURIComponent((LOCALES[getLang()]||'ru-RU').slice(0,2))+'&q='+encodeURIComponent(q);
    let r=await fetch(url,{headers:{'Accept':'application/json'}});if(!r.ok)throw new Error('geocode '+r.status);
    let data=await r.json();
    if(lookupToken!==pickerLookupToken||!document.getElementById('eplace'))return;
    if(!data.length){status.textContent='Не нашёл. Поставь точку на карте.';return}
    let lat=+data[0].lat,lng=+data[0].lon;if(!validCoordinates(lat,lng))throw new Error('invalid coordinates');
    await setPickerPoint(lat,lng);
    if(lookupToken===pickerLookupToken&&(!q||q.length<3))document.getElementById('eplace').value=String(data[0].display_name||'').split(',').slice(0,2).join(', ');
  }catch(err){if(lookupToken===pickerLookupToken){const el=document.getElementById('pickedCoords');if(el)el.textContent='Не удалось найти. Поставь точку на карте.';}}
}

function deleteEvent(id){showConfirm('Удалить событие?','Событие будет удалено без возможности восстановления.',()=>{db.events=db.events.filter(e=>e.id!==id);delete db.chats[id];delete db.questions[id];save();go('mine');showToast('Событие удалено','info')},'Удалить')}
function renderMine(){let own=db.events.filter(e=>e.owner===2&&isVisibleEvent(e)),joined=db.events.filter(e=>e.people.includes(2)&&e.owner!==2&&isVisibleEvent(e)),history=db.events.filter(e=>(e.owner===2||e.people.includes(2))&&!isVisibleEvent(e));document.getElementById('content').innerHTML=`<div class="mine-wrap"><div class="mine-head"><div><h2>Мои события</h2><div class="mine-sub">То, что ты создал и куда уже собираешься</div></div><span class="tag mine-total">${own.length+joined.length} активных</span></div><div class="mine-section"><div class="mine-section-title"><h3>✦ Я создал</h3><span>${own.length}</span></div>${own.map(e=>eventCardMine(e,true)).join('')||'<div class="empty"><b>Пока ничего не создал.</b><br>Придумай первое событие — пусть люди присоединятся.</div>'}</div><div class="mine-section"><div class="mine-section-title"><h3>🙋 Я иду</h3><span>${joined.length}</span></div>${joined.map(e=>eventCardMine(e,false)).join('')||'<div class="empty"><b>Пока никуда не записался.</b><br>Загляни на карту и найди, чем хочется заняться.</div>'}</div>${history.length?`<div class="mine-section"><div class="mine-section-title"><h3>🕘 Прошедшие</h3><span>${history.length}</span></div>${history.map(e=>eventCardMine(e,e.owner===2)).join('')}</div>`:''}</div>`}
function eventCardMine(e,own){let icon=eventIcon(e.cat,e.title,e.emoji);let started=eventState(e)==='STARTED';let status=started?'🟢 Событие идёт':(own?'Ты организатор':(e.people.length>=e.limit?'Мест нет':'Ты участвуешь'));let peoplePreview=e.people.slice(0,4).map((p,i)=>`<span>${i===0?'🙂':i===1?'😎':i===2?'🙌':'🤝'}</span>`).join('');return `<div class="mine-card"><div class="mine-card-top"><div class="mine-icon">${icon}</div><div class="mine-title"><h4>${esc(e.title)}</h4><span class="mine-status ${started?'live':(own?'owner':'')}">${status}</span></div></div><div class="mine-meta"><div>🕒 ${fmt(e)}</div><div>📍 ${esc(displayPlace(e))}</div><div>👥 ${e.people.length}/${e.limit} участников</div>${e.ageRange&&e.ageRange!=='Любой возраст'?`<div>👤 ${esc(e.ageRange)}</div>`:''}</div>${e.desc?`<div class="social-note">${esc(e.desc)}</div>`:''}<button type="button" class="mine-people mine-people-btn" onclick="openParticipants(${e.id})" aria-label="Открыть участников"><div class="people-stack">${peoplePreview}</div><span>${e.people.length} ${e.people.length===1?'человек':'человека'} в событии</span><span class="people-arrow">›</span></button><div class="mine-actions">${own?`<button class="secondary" onclick="editEvent(${e.id})">Редактировать</button>`:''}<button class="secondary" onclick="openEvent(${e.id})">Открыть</button>${isEventMember(e)?`<button class="primary" onclick="openChat(${e.id})">Чат</button>`:''}${own&&started?`<button class="danger" onclick="finishEvent(${e.id})">Завершить</button>`:''}</div></div>`}
function editEvent(id){closeModal();currentTab='create';document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.tab==='create'));renderCreate(id)}
function openParticipants(id){
  const e=db.events.find(x=>x.id===id);
  if(!e)return;
  openModal(`<button class="close" onclick="closeModal()">✕</button><h2>Участники</h2><div class="meta" style="margin-bottom:10px">${esc(e.title)} · ${e.people.length}/${e.limit}</div><div class="participant-list">${e.people.map(participantRow).join('')||'<div class="empty">Пока никто не присоединился.</div>'}</div>`);
}
function openChat(id){let e=db.events.find(x=>x.id===id);if(!e||!isEventMember(e)){showToast('Чат доступен только организатору и участникам события.','error');return}if(!db.chats[id]){db.chats[id]=[{u:e.owner,t:'Чат события создан. Увидимся на месте!'}];save();}let msgs=db.chats[id];openModal(`<button class="close" onclick="closeModal()">✕</button><h2>Чат: ${esc(e.title)}</h2><div class="meta" style="margin-bottom:8px">🔒 Только организатор и участники</div><div class="chat"><div class="messages" id="messages">${msgs.map(m=>`<div class="msg ${m.u===2?'me':''}"><b>${esc(db.users[m.u]?.name||'Участник')}</b><br>${esc(m.t)}</div>`).join('')}</div><form class="composer" onsubmit="sendMsg(event,${id})"><input id="chatinput" required placeholder="Написать сообщение..."><button class="primary">➤</button></form></div>`);let box=document.getElementById('messages');box.scrollTop=box.scrollHeight}
function sendMsg(ev,id){ev.preventDefault();let e=db.events.find(x=>x.id===id);if(!e||!isEventMember(e)){closeModal();showToast('Чат доступен только организатору и участникам события.','error');return}let v=document.getElementById('chatinput').value.trim();if(!v)return;if(!db.chats[id])db.chats[id]=[];db.chats[id].push({u:2,t:v});save();openChat(id)}

function navLabel(k){return T(k)}
function applyStaticLanguage(){
 const nav=document.querySelectorAll('.bottomnav .nav');
 if(nav.length===4){nav[0].querySelector('span').textContent=translateText('События');nav[1].querySelector('span').textContent=translateText('Создать');nav[2].querySelector('span').textContent=translateText('Мои');nav[3].querySelector('span').textContent=translateText('Профиль');}
 const top=document.querySelector('.lang-btn,.language-btn'); if(top)top.textContent='🌐 '+getLang().toUpperCase()+' ▾';
}

const __pognaliSourceText=new WeakMap();
function translateText(v){const l=getLang();if(l==='ru')return v;const d=UI_TRANSLATIONS[l]||{};let out=v;Object.keys(d).sort((a,b)=>b.length-a.length).forEach(k=>{if(out===k)out=d[k]});
  out=out.replace(/^(\d+) участников$/,(m,n)=>n+' '+(d['участников']||'participants'));
  out=out.replace(/^(\d+) человек в событии$/,(m,n)=>n+' '+(d['человека']||'people')+' '+(l==='en'?'in event':l==='es'?'en el evento':l==='it'?'nell’evento':l==='de'?'im Event':l==='fr'?'dans l’événement':'в событии'));
  out=out.replace(/^(\d+)\/(\d+) участников$/,(m,a,b)=>a+'/'+b+' '+(d['участников']||'participants'));
  out=out.replace(/^Сейчас по этому фильтру (\d+) (событие|события\/событий)$/,(m,n)=>n+' '+(d['события']||'events'));
  out=out.replace(/^На выбранную дату (\d+) (событие|событий)$/,(m,n)=> (d['На выбранную дату']||'For the selected date')+' '+n+' '+(d['события']||'events'));
  return out;
}
function localizeUI(){
 document.documentElement.lang=getLang();
 const root=document.body;
 const walk=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
 const nodes=[]; while(walk.nextNode())nodes.push(walk.currentNode);
 nodes.forEach(n=>{
   if(n.parentElement&&['SCRIPT','STYLE'].includes(n.parentElement.tagName))return;
   if(!__pognaliSourceText.has(n))__pognaliSourceText.set(n,n.nodeValue);
   const source=__pognaliSourceText.get(n),trim=source.trim(); if(!trim)return;
   const translated=translateText(trim),next=source.replace(trim,translated);
   if(n.nodeValue!==next)n.nodeValue=next;
 });
 root.querySelectorAll('input,textarea').forEach(e=>{
   if(e.placeholder){if(!e.dataset.i18nSource)e.dataset.i18nSource=e.placeholder;e.placeholder=translateText(e.dataset.i18nSource)}
   if(e.getAttribute('aria-label')){if(!e.dataset.i18nAria)e.dataset.i18nAria=e.getAttribute('aria-label');e.setAttribute('aria-label',translateText(e.dataset.i18nAria))}
   if(e.title){if(!e.dataset.i18nTitle)e.dataset.i18nTitle=e.title;e.title=translateText(e.dataset.i18nTitle)}
 });
 root.querySelectorAll('button[title]').forEach(e=>{if(!e.dataset.i18nTitle)e.dataset.i18nTitle=e.title;e.title=translateText(e.dataset.i18nTitle)});
 applyStaticLanguage(); updateLangLabel();
}

function getLang(){return localStorage.getItem('pognali_lang')||'ru'}
function openLanguage(){const cur=getLang();openModal(`<button class="close" onclick="closeModal()">✕</button><h2>${T('AppLanguage')}</h2><div class="meta">${T('ChooseLanguage')}</div><div class="lang-list">${[['ru','🇷🇺 Русский'],['en','🇬🇧 English'],['es','🇪🇸 Español'],['it','🇮🇹 Italiano'],['de','🇩🇪 Deutsch'],['fr','🇫🇷 Français']].map(([id,n])=>`<button class="lang-option ${cur===id?'active':''}" onclick="setLang('${id}')"><span>${n}</span>${cur===id?'✓':''}</button>`).join('')}</div>`)}
function setLang(lang){localStorage.setItem('pognali_lang',lang);updateLangLabel();closeModal();go(currentTab);setTimeout(localizeUI,30)}
function updateLangLabel(){const el=document.getElementById('langLabel');if(el)el.textContent=getLang().toUpperCase()}
function profileMessages(){
  const events=db.events.filter(e=>isEventMember(e));
  const chats=events.filter(e=>Array.isArray(db.chats[e.id])&&db.chats[e.id].length).map(e=>{const msgs=db.chats[e.id];const last=msgs[msgs.length-1];return {e,last}});
  return chats;
}
function messageCountLabel(n){const l=getLang();if(l==='ru')return n+' '+(n%10===1&&n%100!==11?'сообщение':n%10>=2&&n%10<=4&&(n%100<10||n%100>=20)?'сообщения':'сообщений');if(l==='en')return n+' '+(n===1?'message':'messages');if(l==='es')return n+' '+(n===1?'mensaje':'mensajes');if(l==='it')return n+' '+(n===1?'messaggio':'messaggi');if(l==='de')return n+' '+(n===1?'Nachricht':'Nachrichten');if(l==='fr')return n+' '+(n===1?'message':'messages');return n+' messages'}
function participantCountLabel(n){const l=getLang();if(l==='ru')return n+' '+(n%10===1&&n%100!==11?'участник':n%10>=2&&n%10<=4&&(n%100<10||n%100>=20)?'участника':'участников');if(l==='en')return n+' '+(n===1?'participant':'participants');if(l==='es')return n+' '+(n===1?'participante':'participantes');if(l==='it')return n+' '+(n===1?'partecipante':'partecipanti');if(l==='de')return n+' '+(n===1?'Teilnehmer':'Teilnehmer');if(l==='fr')return n+' '+(n===1?'participant':'participants');return n+' participants'}
function renderProfileMessages(){const chats=profileMessages();return `<div class="message-section"><h3>💬 ${translateText('Сообщения')}</h3><div class="message-tabs"><button class="active" type="button">${translateText('По событиям')}</button><button type="button" onclick="openPersonalMessages()">${translateText('Личные')}</button></div><div class="message-list">${chats.length?chats.map(({e,last})=>{const msgs=db.chats[e.id]||[];return `<button class="message-item" onclick="openChat(${e.id})"><span class="message-icon">${eventIcon(e.cat,e.title,e.emoji)}</span><span style="min-width:0;flex:1"><b>${esc(e.title)}</b><small>${translateText('Общий чат')} · ${messageCountLabel(msgs.length)} · ${participantCountLabel(e.people.length)} · ${esc(db.users[last.u]?.name||translateText('Участник'))}: ${esc(last.t)}</small></span><span>›</span></button>`}).join(''):`<div class="empty" style="padding:18px 10px"><b>${translateText('Пока нет сообщений')}</b><br>${translateText('Чаты появятся здесь, когда ты участвуешь в событии.')}</div>`}</div></div>`}
function openPersonalMessages(){openModal(`<button class="close" onclick="closeModal()">✕</button><h2>${translateText('Личные сообщения')}</h2><div class="empty"><b>${translateText('Личных сообщений пока нет.')}</b><br>${translateText('Вопросы организатору и общение доступны в контексте конкретных событий.')}</div>`)}
function renderProfile(){let p=db.profile;document.getElementById('content').innerHTML=`<div class="profile"><h2>Профиль</h2><div class="avatar" onclick="document.getElementById('photoInput').click()">${p.photo?`<img src="${esc(safeImageSrc(p.photo))}" alt="Фото профиля">`:'👤'}</div><input id="photoInput" type="file" accept="image/*" hidden onchange="handlePhoto(this)"><button type="button" class="avatarPick" onclick="document.getElementById('photoInput').click()">📷 Выбрать фотографию</button><div class="field"><label>Имя</label><input id="pname" value="${esc(p.name)}"></div><div class="field"><label>Дата рождения</label><input id="pbirth" type="date" value="${p.birth}"></div><div class="field"><label>Город</label><input id="pcity" value="${esc(p.city)}"></div><div class="field"><label>О себе</label><textarea id="pbio">${esc(p.bio)}</textarea></div><button class="primary full" onclick="saveProfile()">СОХРАНИТЬ ПРОФИЛЬ</button>${renderProfileMessages()}<div class="notice" style="margin:12px 0 0">Фото сохраняется в этом демо на устройстве. В настоящем приложении оно будет загружаться на сервер.</div></div>`}
function handlePhoto(input){let file=input.files?.[0];if(!file)return;if(!file.type.startsWith('image/'))return showToast('Выбери изображение.','error');let reader=new FileReader();reader.onload=()=>{let img=new Image();img.onload=()=>{let max=512,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);db.profile.photo=c.toDataURL('image/jpeg',0.82);save();renderProfile()};img.src=reader.result};reader.readAsDataURL(file)}
function saveProfile(){db.profile={...db.profile,name:document.getElementById('pname').value.trim()||'Пользователь',birth:document.getElementById('pbirth').value,city:document.getElementById('pcity').value.trim(),bio:document.getElementById('pbio').value.trim()};db.users[2]={...(db.users[2]||{}),...db.profile};save();renderProfile();showToast('Профиль сохранён','success')}
function openProfile(){go('profile')}
function updateKeyboardInset(){
  const vv=window.visualViewport;
  if(!vv){document.documentElement.style.setProperty('--keyboard-bottom','0px');return;}
  const keyboard=Math.max(0,Math.round(window.innerHeight-vv.height-vv.offsetTop));
  document.documentElement.style.setProperty('--keyboard-bottom',keyboard+'px');
}
if(window.visualViewport){
  window.visualViewport.addEventListener('resize',updateKeyboardInset);
  window.visualViewport.addEventListener('scroll',updateKeyboardInset);
}
window.addEventListener('resize',updateKeyboardInset);
document.addEventListener('focusin',()=>setTimeout(updateKeyboardInset,50));
document.addEventListener('focusout',()=>setTimeout(updateKeyboardInset,150));
updateKeyboardInset();

function openModal(html){document.getElementById('sheet').innerHTML=html;document.getElementById('modal').classList.add('open');setTimeout(localizeUI,0)}
function closeModal(){document.getElementById('modal').classList.remove('open')}
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function safeImageSrc(src){const v=String(src||'');return /^data:image\/(jpeg|png|webp|gif);base64,[A-Za-z0-9+/=]+$/.test(v)?v:''}
renderEvents();
updateLangLabel();
setTimeout(localizeUI,0);
new MutationObserver(()=>{if(!window.__pognaliLocalizing){window.__pognaliLocalizing=true;setTimeout(()=>{localizeUI();window.__pognaliLocalizing=false},0)}}).observe(document.body,{childList:true,subtree:true,characterData:true});
</script></body></html>
