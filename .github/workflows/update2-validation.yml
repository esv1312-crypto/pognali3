name: Validate Pognali update 2

on:
  push:
    branches:
      - update/pognali-update-2
    paths:
      - 'server/**'
      - 'docs/telegram/index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'test/**'
      - '.github/workflows/update2-validation.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: update/pognali-update-2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install, test and audit
        id: checks
        shell: bash
        run: |
          set +e
          npm install > /tmp/npm-install.log 2>&1
          install_rc=$?
          if [ "$install_rc" -eq 0 ]; then npm test > /tmp/npm-test.log 2>&1; test_rc=$?; else test_rc=99; fi
          if [ "$install_rc" -eq 0 ] && [ "$test_rc" -eq 0 ]; then npm audit --omit=dev > /tmp/npm-audit.log 2>&1; audit_rc=$?; else audit_rc=99; fi
          {
            echo "# Pognali update 2 validation"
            echo
            echo "- npm install exit code: $install_rc"
            echo "- npm test exit code: $test_rc"
            echo "- npm audit --omit=dev exit code: $audit_rc"
            echo
            echo "## npm install (last 40 lines)"
            tail -n 40 /tmp/npm-install.log 2>/dev/null
            echo
            echo "## npm test (last 100 lines)"
            tail -n 100 /tmp/npm-test.log 2>/dev/null
            echo
            echo "## npm audit (last 60 lines)"
            tail -n 60 /tmp/npm-audit.log 2>/dev/null
          } > UPDATE2_VALIDATION.txt
          if [ "$install_rc" -ne 0 ] || [ "$test_rc" -ne 0 ] || [ "$audit_rc" -ne 0 ]; then exit 1; fi
      - name: Publish validation report
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add UPDATE2_VALIDATION.txt package-lock.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: record update 2 validation results"
            git push origin update/pognali-update-2
          fi
