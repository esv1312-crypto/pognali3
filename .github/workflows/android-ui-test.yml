name: Android UI Full User Simulation

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ui-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Create profile photo fixture
        run: |
          python3 - <<'PY'
          import struct, zlib
          w = h = 256
          raw = b''.join(b'\x00' + bytes((120,120,120))*w for _ in range(h))
          def chunk(kind, data):
              return struct.pack(">I", len(data)) + kind + data + struct.pack(">I", zlib.crc32(kind + data) & 0xffffffff)
          png = b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', struct.pack(">IIBBBBB", w,h,8,2,0,0,0)) + chunk(b'IDAT', zlib.compress(raw, 9)) + chunk(b'IEND', b'')
          open("qa-profile.png","wb").write(png)
          PY

      - name: Run full human-style Android simulation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 1200
          cores: 2
          ram-size: 4096M
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          disable-animations: true
          script: bash .github/scripts/android-ui-sim.sh


      - name: Upload visual test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-test-run-${{ github.run_number }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 14
# QA trigger: rerun hardened emulator simulation
