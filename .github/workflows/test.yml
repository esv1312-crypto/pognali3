name: Tests

on:
  push:
    branches:
      - feature/telegram-mini-app
  pull_request:
    branches:
      - feature/telegram-mini-app

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Run regression tests
        run: npm test
