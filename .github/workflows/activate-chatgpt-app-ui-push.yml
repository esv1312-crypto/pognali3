name: Activate Pognali ChatGPT UI on update

on:
  workflow_dispatch:
  push:
    branches:
      - chatgpt-mvp-skeleton
    paths:
      - chatgpt/mcp/server.py
      - chatgpt/app/pognali-events.html
      - .github/workflows/activate-chatgpt-app-ui-push.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MCP SDK
        run: python3 -m pip install -r chatgpt/mcp/requirements.txt
      - name: Validate MCP Apps server imports
        run: python3 -c "from chatgpt.mcp.server import mcp; print(mcp)"
