name: Inspect uploaded Pognali update archive

on:
  push:
    branches:
      - feature/telegram-mini-app
    paths:
      - 'pognali-update-2.zip'
      - '.github/workflows/unpack-pognali-update-2.yml'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/telegram-mini-app
          fetch-depth: 0
      - name: Verify archive and create inspection branch
        shell: bash
        run: |
          set -euo pipefail
          test -s pognali-update-2.zip
          unzip -t pognali-update-2.zip
          mkdir -p /tmp/pognali-update-2
          unzip -q pognali-update-2.zip -d /tmp/pognali-update-2
          echo "Archive files:"
          find /tmp/pognali-update-2 -type f -printf '%P (%s bytes)\n' | sort
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="inspection/pognali-update-2-unpacked"
          git checkout -B "$branch"
          mkdir -p archive-inspection/pognali-update-2
          cp -a /tmp/pognali-update-2/. archive-inspection/pognali-update-2/
          git add archive-inspection/pognali-update-2
          if git diff --cached --quiet; then
            echo "No extracted file changes."
          else
            git commit -m "chore: unpack pognali update archive for review"
            git push origin "$branch" --force
          fi
