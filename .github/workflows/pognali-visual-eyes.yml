name: Pognali Visual Eyes

on:
  workflow_dispatch:
  push:
    branches:
      - feature/telegram-mini-app
    paths:
      - 'docs/telegram/**'
      - '.github/workflows/pognali-visual-eyes.yml'
      - 'tests/visual/**'

permissions:
  contents: read

concurrency:
  group: pognali-visual-eyes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-visual-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: ''

      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock @playwright/test
          npx playwright install --with-deps chromium

      - name: Start local static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/pognali-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/docs/telegram/index.html > /dev/null; then
              echo "Static server is ready"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/pognali-http.log
          exit 1

      - name: Capture screens and inspect responsive UI
        run: npx playwright test tests/visual/pognali-visual.spec.cjs --reporter=list
        env:
          CI: 'true'

      - name: Upload screenshots and visual report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pognali-visual-eyes-${{ github.run_number }}
          path: test-results/pognali-visual/
          if-no-files-found: warn
          retention-days: 14
