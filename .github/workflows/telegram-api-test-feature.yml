name: Telegram Mini App API tests (feature branch)

on:
  pull_request:
    branches:
      - feature/telegram-mini-app
    paths:
      - 'server/**'
      - 'test/**'
      - 'docs/telegram/index.html'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/telegram-api-test-feature.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      - run: npm audit --omit=dev
