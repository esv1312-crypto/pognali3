name: ChatGPT Pognali Core Test

on:
  workflow_dispatch:
  push:
    branches:
      - chatgpt-mvp-skeleton
      - main
    paths:
      - "chatgpt/**"
      - ".github/workflows/chatgpt-core-test.yml"

jobs:
  core-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Core API tests
        run: python3 chatgpt/core/test_server.py
