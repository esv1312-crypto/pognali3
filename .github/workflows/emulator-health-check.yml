name: Android Emulator Environment Health Check

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  emulator-health:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Start clean emulator and verify Android environment
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 1200
          cores: 2
          ram-size: 4096M
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          disable-animations: true
          script: bash .github/scripts/emulator-health.sh

      - name: Upload emulator health evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-health-${{ github.run_number }}
          path: test-results/emulator-health/
          retention-days: 14