name: Activate Pognali ChatGPT UI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Activate MCP Apps server
        run: |
          base64 -d chatgpt/mcp/apps_server.b64 > chatgpt/mcp/server.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chatgpt/mcp/server.py
          git commit -m "Activate MCP Apps event UI" || exit 0
          git push
